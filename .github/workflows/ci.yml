name: CI

# Drei Pruefungen, die jeder PR bestehen muss, bevor er auf main darf:
#
#   1. Der Selbsttest des Kits, `node .ara/tools/selftest.mjs`. Er prueft die
#      Werkzeuge unter .ara/tools/, die Schreibweise (keine Gedankenstriche,
#      Dateinamen klein und ohne Umlaute), Verweise und das Papier. Er laeuft
#      mit jeder Node-Fassung, die das README zulaesst, damit ein Partner mit
#      Node 20 nicht anders faehrt als einer mit Node 24.
#   2. Markdown-Lint ueber alle Textdateien. Die Regeln stehen in
#      .markdownlint-cli2.jsonc, dort steht auch, warum welche aus ist.
#   3. "CI Summary" fasst beides zusammen. Nur dieser eine Name steht im
#      Ruleset von main als Pflicht-Check. Wer einen Job dazubaut, traegt ihn
#      unten in die Liste ein, sonst zaehlt er nicht.
#
# Kein paths-ignore: das Kit besteht zum groessten Teil aus Markdown, und ein
# uebersprungener Pflicht-Check haelt einen PR fest statt ihn freizugeben. Der
# ganze Lauf braucht unter einer Minute, das Sparen lohnt nicht.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selftest:
    name: Selbsttest (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 ist die Untergrenze aus dem README, 24 die aktuelle Fassung.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Der Selbsttest druckt ein Probe-PDF, wenn er einen Chromium findet.
      # ubuntu-latest bringt Google Chrome unter /usr/bin/google-chrome mit,
      # pdf.mjs kennt den Pfad. Faellt der Browser vom Runner, sagt der
      # Selbsttest "gedruckt nicht" statt rot zu werden, darum steht die
      # Zeile hier: sie belegt, ob wirklich gedruckt wurde.
      - name: Welcher Browser druckt
        run: node .ara/tools/pdf.mjs --browser

      - name: Selbsttest
        run: node .ara/tools/selftest.mjs

  markdown:
    name: Markdown-Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Feste Fassung, damit ein neues Release des Linters nicht ueber Nacht
      # einen unveraenderten PR rot macht.
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.18.1

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [selftest, markdown]
    if: always()
    steps:
      - name: Ergebnisse zusammenfassen
        env:
          ERGEBNISSE: |
            Selbsttest=${{ needs.selftest.result }}
            Markdown=${{ needs.markdown.result }}
        run: |
          fehler=0
          while IFS='=' read -r name ergebnis; do
            [ -z "$name" ] && continue
            printf '%-12s %s\n' "$name" "$ergebnis"
            [ "$ergebnis" = "success" ] || fehler=1
          done <<< "$ERGEBNISSE"
          if [ "$fehler" = "1" ]; then
            echo "Mindestens eine Pruefung ist nicht gruen."
            exit 1
          fi
          echo "Alle Pruefungen gruen."
